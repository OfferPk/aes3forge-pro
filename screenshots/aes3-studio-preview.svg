<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#0a0e17" />
  <rect x="0" y="0" width="1200" height="80" fill="#111827" stroke="#334155" stroke-width="1" />
  <text x="40" y="48" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="bold">AES3Forge Pro</text>
  <text x="240" y="48" fill="#94a3b8" font-family="sans-serif" font-size="14">v1.0.0 — AES3 / AES-EBU / S/PDIF Digital Audio Studio</text>
  <rect x="920" y="26" width="240" height="30" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1" />
  <text x="1040" y="46" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">BIPHASE MARK CARRIER LOCKED</text>

  <!-- Left Card: Framing -->
  <rect x="40" y="120" width="540" height="480" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="65" y="160" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Subframe Telemetry &amp; Preambles</text>
  <text x="65" y="195" fill="#94a3b8" font-family="sans-serif" font-size="14">Standard: AES3-2009 Professional (110-Ohm Balanced XLR)</text>
  <text x="65" y="225" fill="#94a3b8" font-family="sans-serif" font-size="14">Sample Rate: 48 kHz | Word Length: 24-bit Linear PCM</text>

  <rect x="65" y="255" width="490" height="75" rx="6" fill="#0f172a" />
  <text x="80" y="280" fill="#94a3b8" font-family="monospace" font-size="11">PHYSICAL CARRIER RATE (64 BITS/FRAME @ 48 KHZ)</text>
  <text x="80" y="308" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">3.072 Mbps (6.144 Mbaud Biphase Symbol Rate)</text>

  <rect x="65" y="350" width="490" height="220" rx="6" fill="#0f172a" />
  <text x="80" y="380" fill="#94a3b8" font-family="monospace" font-size="11">10-POINT NORMATIVE AUDIT STATUS</text>
  <text x="80" y="410" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">Score: 100% PASS (10/10 Standard Checks)</text>
  <text x="80" y="440" fill="#94a3b8" font-family="monospace" font-size="12">Preamble Sync Violations (B / M / W): [PASS]</text>
  <text x="80" y="465" fill="#94a3b8" font-family="monospace" font-size="12">192-Frame Channel Status Block Boundary: [PASS]</text>
  <text x="80" y="490" fill="#94a3b8" font-family="monospace" font-size="12">Subframe Bit 31 Even Parity Calculation: [PASS]</text>
  <text x="80" y="515" fill="#94a3b8" font-family="monospace" font-size="12">Professional Channel Status Bit 0 Tagging: [PASS]</text>

  <!-- Right Card: 192-Bit CS Block -->
  <rect x="620" y="120" width="540" height="480" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="645" y="160" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">192-Frame Channel Status Block (24 Bytes)</text>
  <rect x="645" y="185" width="490" height="385" rx="6" fill="#0f172a" />
  <text x="665" y="225" fill="#38bdf8" font-family="monospace" font-size="13">Byte 0 (Mode/Rate): 0x41 [Professional | 48 kHz | No Emphasis]</text>
  <text x="665" y="255" fill="#94a3b8" font-family="monospace" font-size="13">Byte 1 (Channels):  0x01 [Two-Channel Stereo Mode]</text>
  <text x="665" y="285" fill="#94a3b8" font-family="monospace" font-size="13">Byte 2 (Resolution):0x02 [24-Bit Linear PCM Word Length]</text>
  <text x="665" y="315" fill="#94a3b8" font-family="monospace" font-size="13">Byte 3 (Multi-Ch):  0x00 [Stereo Channel 1/2 Pair]</text>
  <text x="665" y="345" fill="#94a3b8" font-family="monospace" font-size="13">Byte 4 (Reference): 0x00 [Default Grade 1/2 Reference]</text>
  
  <text x="665" y="410" fill="#10b981" font-family="monospace" font-size="12">HEX STREAM (24 BYTES):</text>
  <text x="665" y="435" fill="#94a3b8" font-family="monospace" font-size="12">41 01 02 00 00 00 00 00 00 00 00 00</text>
  <text x="665" y="460" fill="#94a3b8" font-family="monospace" font-size="12">00 00 00 00 00 00 00 00 00 00 00 00</text>
</svg>
